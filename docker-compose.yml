version: '3.8'

services:
  backend:
    build: .
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - MONGODB_URI=mongodb://mongo:27017/export_crm_db
      - JWT_ACCESS_SECRET=export_crm_jwt_access_secret_key_2026_secure_key
      - JWT_REFRESH_SECRET=export_crm_jwt_refresh_secret_key_2026_secure_key
    depends_on:
      - mongo

  mongo:
    image: mongo:latest
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

volumes:
  mongo-data:
